mode: Rule
proxies:
  - name: 节点A
    type: ss
    server: 1.2.3.4
    port: 8388
    cipher: aes-256-gcm
    alpn:
      - h3
      - h2
  - name: 节点B
    type: vmess
    server: 5.6.7.8
    port: 443
    uuid: x
proxy-groups:
  - name: 自动选择
    type: url-test
    proxies:
      - 节点A
      - 节点B
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30
  - name: 🚀 手动选择
    type: select
    proxies:
      - 节点A
      - DIRECT
rules:
  - MATCH,🚀 手动选择
